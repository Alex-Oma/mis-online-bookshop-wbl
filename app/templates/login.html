<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Sign In — MyEnglishBooks MIS</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gradient-to-br from-blue-900 to-blue-700 min-h-screen flex items-center justify-center">
  <div class="bg-white rounded-2xl shadow-2xl w-full max-w-sm p-8">

    <div class="text-center mb-6">
      <div class="text-4xl mb-2">📚</div>
      <h1 class="text-xl font-bold text-gray-800">MyEnglishBooks MIS</h1>
      <p class="text-sm text-gray-500 mt-1">Management Information System</p>
    </div>

    <!-- Error message -->
    <div id="error-msg" class="hidden bg-red-50 border border-red-200 text-red-700
         text-sm rounded-lg p-3 mb-4"></div>

    <form id="login-form" class="space-y-4">
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Username</label>
        <input
          type="text" id="username" name="username" required
          autocomplete="username"
          class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm
                 focus:outline-none focus:ring-2 focus:ring-blue-500"
          placeholder="Enter your username"
        />
      </div>
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Password</label>
        <input
          type="password" id="password" name="password" required
          autocomplete="current-password"
          class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm
                 focus:outline-none focus:ring-2 focus:ring-blue-500"
          placeholder="Enter your password"
        />
      </div>
      <button
        type="submit"
        class="w-full bg-blue-700 hover:bg-blue-800 text-white font-semibold
               py-2 rounded-lg transition-colors text-sm"
      >
        Sign In
      </button>
    </form>

    <p class="text-center text-xs text-gray-400 mt-6">
      MyEnglishBooks MIS v1.0 · Confidential
    </p>
  </div>

  <script>
    document.getElementById('login-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const errDiv = document.getElementById('error-msg');
      errDiv.classList.add('hidden');

      const username = document.getElementById('username').value;
      const password = document.getElementById('password').value;

      try {
        const res = await fetch('/auth/login', {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({username, password}),
          credentials: 'include',
        });
        const data = await res.json();

        if (res.ok) {
          window.location.href = '/admin/dashboard';
        } else {
          errDiv.textContent = data.detail || 'Invalid username or password';
          errDiv.classList.remove('hidden');
        }
      } catch (err) {
        errDiv.textContent = 'Connection error. Please try again.';
        errDiv.classList.remove('hidden');
      }
    });
  </script>
</body>
</html>
