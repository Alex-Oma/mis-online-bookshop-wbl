<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>{% block title %}MyEnglishBooks MIS{% endblock %}</title>
  <!-- TailwindCSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Chart.js CDN -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
  <style>
    .sidebar-link { @apply flex items-center gap-2 px-4 py-2 rounded-lg text-sm font-medium transition-colors; }
    .sidebar-link:hover { @apply bg-blue-700; }
    .sidebar-link.active { @apply bg-blue-800 font-semibold; }
  </style>
</head>
<body class="bg-gray-50 text-gray-800 min-h-screen flex">

  <!-- Sidebar navigation -->
  <aside class="w-56 bg-blue-900 text-white flex flex-col min-h-screen fixed top-0 left-0 z-10">
    <div class="px-5 py-5 border-b border-blue-700">
      <p class="text-xs text-blue-300 uppercase tracking-widest">Management System</p>
      <h1 class="text-base font-bold leading-tight">📚 MyEnglishBooks</h1>
    </div>

    <nav class="flex-1 px-3 py-4 space-y-1">
      <a href="/admin/dashboard" class="sidebar-link {% if request.url.path == '/admin/dashboard' %}active{% endif %}">
        📊 Dashboard
      </a>
      <a href="/admin/reports" class="sidebar-link {% if request.url.path == '/admin/reports' %}active{% endif %}">
        📄 Reports
      </a>
      <a href="/admin/alerts" class="sidebar-link {% if request.url.path == '/admin/alerts' %}active{% endif %}">
        🔔 Alerts
      </a>
      <a href="/admin/audit" class="sidebar-link {% if request.url.path == '/admin/audit' %}active{% endif %}">
        🔍 Audit Log
      </a>
    </nav>

    <!-- User info + logout -->
    <div class="px-4 py-4 border-t border-blue-700 text-xs text-blue-300">
      {% if user is defined %}
      <p class="mb-1">Signed in as <strong class="text-white">{{ user.username }}</strong></p>
      <p class="mb-2 capitalize">Role: {{ user.role }}</p>
      {% endif %}
      <a href="/admin/logout" class="text-blue-300 hover:text-white underline">Sign out</a>
    </div>
  </aside>

  <!-- Main content -->
  <main class="ml-56 flex-1 p-6">
    {% block content %}{% endblock %}
  </main>

</body>
</html>
