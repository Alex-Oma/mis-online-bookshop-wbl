# Render.com infrastructure-as-code
# Deploy: connect GitHub repo to Render and this file is auto-detected.
# Docs: https://render.com/docs/blueprint-spec

services:
  # ── FastAPI backend + admin UI ────────────────────────────────────────────
  - type: web
    name: mis-backend
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port 8000
    healthCheckPath: /health
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: LOG_LEVEL
        value: INFO
      # ── Secrets — set values in Render Dashboard, never commit here ───────
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET_KEY
        sync: false
      - key: OPENCART_DB_HOST
        sync: false
      - key: OPENCART_DB_PORT
        sync: false
      - key: OPENCART_DB_NAME
        value: "bookshop"
      - key: OPENCART_DB_USER
        sync: false
      - key: OPENCART_DB_PASSWORD
        sync: false
      - key: ROZETKA_API_BASE_URL
        value: "https://api-seller.rozetka.com.ua"
      - key: ROZETKA_API_USERNAME
        sync: false
      - key: ROZETKA_API_PASSWORD_B64
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USERNAME
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_FROM_NAME
        value: "MyEnglishBooks MIS"
      - key: ALERT_TO_EMAIL
        sync: false
      - key: INGESTION_INTERVAL_HOURS
        value: "6"
      - key: ALERT_CHECK_INTERVAL_MINUTES
        value: "30"

